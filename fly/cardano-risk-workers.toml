app = "cardano-risk-workers"
primary_region = "sin"

[build]
  dockerfile = "cardano-risk-workers.Dockerfile"

[processes]
  risk = "sh -c 'SOKOSUMI_COWORKER_ID=$RISK_SOKOSUMI_COWORKER_ID SOKOSUMI_COWORKER_API_KEY=$RISK_SOKOSUMI_COWORKER_API_KEY MPS_AGENT_IDENTIFIER=$RISK_MPS_AGENT_IDENTIFIER exec bun src/worker.ts'"
  security = "sh -c 'SOKOSUMI_COWORKER_ID=$SEC_SOKOSUMI_COWORKER_ID SOKOSUMI_COWORKER_API_KEY=$SEC_SOKOSUMI_COWORKER_API_KEY MPS_AGENT_IDENTIFIER=$SEC_MPS_AGENT_IDENTIFIER exec bun ../security/worker/src/worker.ts'"
  server = "bun ../security/worker/src/server.ts"

[http_service]
  internal_port = 4412
  processes = ["server"]
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
